name: Build STM32F303 applications (NO FLASH)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GCC toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - name: Unit-test read-only page planner
        run: python3 -m unittest discover -s tests -v
      - name: Compile and check application layout
        run: make
      - name: Obtain pinned libopencm3 source
        run: |
          git clone --quiet https://github.com/libopencm3/libopencm3.git external/libopencm3
          git -C external/libopencm3 checkout --quiet ddcbb2889fa018626c604e27ea50e66db5755b78
          make -C external/libopencm3 -j2 TARGETS=stm32/f3
      - name: Compile USB enumeration probe (not flashed)
        run: make usb-probe
      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frame1-stm32-experimental-NOT-FOR-FLASHING
          path: |
            build/*.elf
            build/*.bin
            build/*.map
